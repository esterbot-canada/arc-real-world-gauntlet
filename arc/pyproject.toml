[project]
name = "agent-work-evidence"
version = "0.1.0"
description = "Deterministic contract and evidence checks for AI-generated pull requests"
requires-python = ">=3.11"
dependencies = [
  "tree-sitter>=0.24,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
  "typer>=0.12.0",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
agent-evidence = "agent_work_evidence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_work_evidence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
