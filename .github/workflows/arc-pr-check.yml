name: ARC PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  arc-pr-check:
    name: ARC Trust Brief
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with base history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/arc/agent-review-control/package-lock.json

      - name: Install ARC verifier dependencies
        run: npm ci --prefix .github/arc/agent-review-control

      - name: Build trusted command receipts
        id: arc-receipts
        continue-on-error: true
        run: node .github/arc/agent-review-control/scripts/arc-run-required-commands.mjs --plan .arc/plan.aiplan --out .arc/tmp/arc-command-receipts.json --log-dir .arc/tmp/arc-command-logs

      - name: Run ARC Trust Brief
        id: arc-check
        continue-on-error: true
        run: node .github/arc/agent-review-control/scripts/arc-pr-check.mjs --plan .arc/plan.aiplan --receipts .arc/tmp/arc-command-receipts.json --out .arc/tmp/arc-trust-brief.md

      - name: Add Trust Brief to job summary
        if: always()
        run: |
          if [ -f .arc/tmp/arc-trust-brief.md ]; then
            cat .arc/tmp/arc-trust-brief.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post ARC Trust Brief PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .arc/tmp/arc-trust-brief.md ]; then
            node .github/arc/agent-review-control/scripts/arc-post-pr-comment.mjs --body .arc/tmp/arc-trust-brief.md
          fi

      - name: Enforce ARC verdict
        if: steps.arc-receipts.outcome == 'failure' || steps.arc-check.outcome == 'failure'
        run: exit 1
