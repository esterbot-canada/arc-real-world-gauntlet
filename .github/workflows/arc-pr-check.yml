name: ARC repository checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.12"
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ARC tests
        run: uv run --project arc --extra dev pytest

      - name: Run ARC gauntlet
        run: npm run arc:gauntlet
