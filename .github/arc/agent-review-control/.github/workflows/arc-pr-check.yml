name: ARC PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  arc-pr-check:
    name: ARC Trust Brief
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with base history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/agent-review-control/package-lock.json

      - name: Install ARC dependencies
        working-directory: apps/agent-review-control
        run: npm ci

      - name: Build trusted command receipts
        id: arc-receipts
        continue-on-error: true
        working-directory: apps/agent-review-control
        run: npm run arc:run-required-commands -- --plan .arc/plan.aiplan --out tmp/arc-command-receipts.json --log-dir tmp/arc-command-logs

      - name: Run ARC Trust Brief
        uses: ./.github/actions/arc-pr-check
        with:
          plan: .arc/plan.aiplan
          receipts: tmp/arc-command-receipts.json
          out: tmp/arc-trust-brief.md
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail when required command receipts failed
        if: steps.arc-receipts.outcome == 'failure'
        run: exit 1
