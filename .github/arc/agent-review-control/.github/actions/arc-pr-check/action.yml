name: ARC PR Check
description: Compare a frozen minimal .aiplan against a PR diff and render an ARC Trust Brief.
inputs:
  plan:
    description: Path to the frozen minimal .aiplan, relative to apps/agent-review-control.
    required: true
  receipts:
    description: Path to command receipts JSON, relative to apps/agent-review-control.
    required: true
  out:
    description: Trust Brief markdown output path, relative to apps/agent-review-control.
    required: false
    default: tmp/arc-trust-brief.md
  github-token:
    description: GitHub token used to create or update the ARC Trust Brief PR comment.
    required: false
    default: ''
  comment:
    description: Whether to create or update the ARC Trust Brief PR comment.
    required: false
    default: 'true'
  blocking:
    description: Whether Needs Review should fail the check. Keep true for required merge gates.
    required: false
    default: 'true'
  working-directory:
    description: Directory containing the ARC package.json.
    required: false
    default: apps/agent-review-control
runs:
  using: composite
  steps:
    - name: Install ARC dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
    - name: Run ARC PR check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        args=(--plan "${{ inputs.plan }}" --receipts "${{ inputs.receipts }}" --out "${{ inputs.out }}")
        if [ "${{ inputs.blocking }}" != "true" ]; then
          args+=(--allow-needs-review-exit-0)
        fi
        npm run arc:pr-check -- "${args[@]}"
    - name: Add Trust Brief to job summary
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -f "${{ inputs.out }}" ]; then
          cat "${{ inputs.out }}" >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Annotate ARC Needs Review
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -f "${{ inputs.out }}" ] && grep -q '^## ARC Trust Brief: Needs Review' "${{ inputs.out }}"; then
          echo "::error title=ARC Needs Review::ARC blocked this PR because deterministic evidence needs human review. Read the Trust Brief comment or job summary."
        fi
    - name: Post ARC Trust Brief PR comment
      if: always() && inputs.comment == 'true' && inputs.github-token != '' && github.event_name == 'pull_request'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        if [ -f "${{ inputs.out }}" ]; then
          npm run arc:post-pr-comment -- --body "${{ inputs.out }}"
        fi
